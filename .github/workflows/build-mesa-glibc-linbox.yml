# build-mesa-winlator.yml
name: Build Mesa Winlator (aarch64 only)

on:
  workflow_dispatch:
    inputs:
      mesa_branch:
        description: 'Mesa 分支/标签/提交 (例如: main, 24.3, 24.4.0, adreno-main)'
        required: false
        default: 'adreno-main'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: 设置构建参数
      id: setup
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "MESA_BRANCH=${{ github.event.inputs.mesa_branch || 'gen8' }}" >> $GITHUB_ENV
        else
          echo "MESA_BRANCH=gen8" >> $GITHUB_ENV
        fi
        
        BUILD_DATE=$(date +%Y%m%d)
        echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
        echo "INSTALL_PREFIX=/data/data/a.io.github.ewt45.winemulator/files/linbox/usr" >> $GITHUB_ENV
        
        echo "使用的 Mesa 分支/标签: $MESA_BRANCH"
        echo "安装目录: $INSTALL_PREFIX"
        echo "构建日期: $BUILD_DATE"

    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 显示环境信息
      run: |
        echo "构建环境信息:"
        uname -a
        lscpu | grep -E 'Model name|Architecture|CPU MHz|Core'
        free -h
        echo "当前架构: $(uname -m)"
        echo "目标架构: aarch64"

    - name: 安装系统依赖
      run: |
        sudo sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt install -y \
          glslang-tools libxrandr-dev libxxf86vm-dev libxcb-shm0-dev libxcb-glx0-dev \
          libxext-dev llvm-19 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev \
          libxcb-present-dev libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev \
          libxshmfence-dev libdrm-dev libgbm-dev libegl1-mesa-dev libexpat1-dev \
          python3-pip python3-setuptools python3-wheel ninja-build \
          pulseaudio libasound2-plugins wget unzip cmake git \
          flex bison libtool libclc-20-dev pkg-config build-essential libatomic1 \
          gcc g++ make cmake
        
        echo "系统依赖安装完成"

    - name: 安装 Python 构建工具
      run: |
        sudo pip3 install meson mako
        echo "检查安装的 meson 版本:"
        meson --version
        python3 -c "import mesonbuild; print('mesonbuild 模块路径:', mesonbuild.__file__)"
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: 克隆 Mesa 源码
      run: |
        echo "📥 克隆 Mesa 仓库..."
        git clone https://github.com/lfdevs/mesa-for-android-container.git mesa
        cd mesa
        
        if [ -n "$MESA_BRANCH" ] && [ "$MESA_BRANCH" != "main" ]; then
          echo "检出分支: $MESA_BRANCH"
          git checkout $MESA_BRANCH
        fi
        
        GIT_HASH=$(git rev-parse --short HEAD)
        if [ -f "VERSION" ]; then
          OFFICIAL_VERSION=$(cat VERSION)
        else
          OFFICIAL_VERSION="git-$GIT_HASH"
        fi
        
        GIT_DESCRIBE=$(git describe --tags --always 2>/dev/null || echo "custom-$GIT_HASH")
        
        echo "MESA_GIT_HASH=$GIT_HASH" >> $GITHUB_ENV
        echo "MESA_VERSION=$OFFICIAL_VERSION" >> $GITHUB_ENV
        echo "GIT_DESCRIBE=$GIT_DESCRIBE" >> $GITHUB_ENV
        echo "MESA_BRANCH_ACTUAL=$(git branch --show-current)" >> $GITHUB_ENV
        
        echo "✅ 源码克隆完成"
        echo "版本: $OFFICIAL_VERSION"
        echo "提交: $GIT_HASH"
        echo "描述: $GIT_DESCRIBE"

    # ==================== 关键修复部分 ====================
    - name: 应用 winlator x11 补丁（带保护和验证）
      run: |
        echo "=== 开始应用补丁 ==="
        cd mesa

        # 备份原始文件（如果存在）
        if [ -f src/vulkan/wsi/wsi_common_x11.c ]; then
          cp src/vulkan/wsi/wsi_common_x11.c src/vulkan/wsi/wsi_common_x11.c.bak
        fi

        # 下载补丁文件
        echo "下载补丁文件..."
        wget -O wsi_common_x11.c.new https://github.com/afeimod/linbox/raw/main/path/wsi_common_x11.c
        if [ ! -f wsi_common_x11.c.new ]; then
          echo "错误：补丁下载失败"
          exit 1
        fi

        # 替换原文件
        echo "替换文件..."
        mv wsi_common_x11.c.new src/vulkan/wsi/wsi_common_x11.c
        if [ ! -f src/vulkan/wsi/wsi_common_x11.c ]; then
          echo "错误：移动文件失败"
          exit 1
        fi

        # 设置只读权限，防止意外修改
        echo "设置文件权限为只读 (444)..."
        chmod 444 src/vulkan/wsi/wsi_common_x11.c

        # 计算并保存文件哈希，用于后续验证
        sha256sum src/vulkan/wsi/wsi_common_x11.c > /tmp/wsi_common.hash
        echo "补丁文件哈希已保存"

        echo "=== 补丁应用完成 ==="

    - name: 构建 aarch64 架构（带补丁验证）
      run: |
        echo "🔨 开始构建 aarch64 架构..."
        cd mesa

        # 验证补丁文件是否仍为预期内容（未被恢复）
        echo "验证补丁文件完整性..."
        if ! sha256sum -c /tmp/wsi_common.hash; then
          echo "⚠️ 警告：补丁文件已被修改或恢复，重新应用补丁..."
          
          # 重新下载补丁
          wget -O src/vulkan/wsi/wsi_common_x11.c https://github.com/afeimod/linbox/raw/main/path/wsi_common_x11.c
          if [ $? -ne 0 ]; then
            echo "错误：重新下载补丁失败"
            exit 1
          fi
          
          # 重新设置只读权限
          chmod 444 src/vulkan/wsi/wsi_common_x11.c
          
          # 更新哈希记录
          sha256sum src/vulkan/wsi/wsi_common_x11.c > /tmp/wsi_common.hash
          echo "补丁已重新应用"
        else
          echo "✅ 补丁文件完好，继续构建"
        fi

        # 创建安装目录
        sudo mkdir -p $INSTALL_PREFIX
        sudo chmod 777 -R /data/data/a.io.github.ewt45.winemulator/files/linbox

        # 创建构建目录
        mkdir -p build-aarch64

        # 配置 aarch64 构建
        meson setup build-aarch64 \
           --prefix=/data/data/a.io.github.ewt45.winemulator/files/linbox/usr \
           -Dplatforms=x11 \
           -Dbuildtype=release \
           -Degl-native-platform=x11 \
           -Dgallium-drivers=freedreno,zink \
           -Dvulkan-drivers=freedreno \
           -Dfreedreno-kmds=kgsl \
           -Dshader-cache=enabled \
           -Dgles1=enabled \
           -Dgles2=enabled \
           -Dopengl=true \
           -Dgbm=enabled \
           -Dglx=dri \
           -Degl=enabled \
           -Dglvnd=disabled \
           -Dmicrosoft-clc=disabled \
           -Dllvm=enabled \
           -Dshared-llvm=enabled \
           -Dvulkan-beta=true \
           -Dvideo-codecs=all

        echo "🏗️  正在构建 aarch64..."
        ninja -C build-aarch64 -j$(nproc)

        echo "📦 正在安装 aarch64..."
        sudo ninja -C build-aarch64 install

        # 验证安装
        echo "aarch64 安装验证:"
        ls -la $INSTALL_PREFIX/lib/
        file $INSTALL_PREFIX/lib/*.so 2>/dev/null | head -5 || true

    - name: 打包构建产物
      run: |
        echo "📦 开始打包..."
        PACKAGE_NAME="rootfsmesa-${MESA_VERSION}-aarch64"
        ARCH_DESC="aarch64"
        
        cd /data/data/a.io.github.ewt45.winemulator/files/linbox
        tar -czvf "${HOME}/${PACKAGE_NAME}-full.tar.gz" usr/
        
        cd $GITHUB_WORKSPACE
        mv "${HOME}/${PACKAGE_NAME}-full.tar.gz" .
        sha256sum ${PACKAGE_NAME}-*.tar.gz > checksums.txt
        
        echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
        echo "FULL_PACKAGE=${PACKAGE_NAME}-full.tar.gz" >> $GITHUB_ENV
        echo "ARCH_DESC=${ARCH_DESC}" >> $GITHUB_ENV
        
        echo "📦 打包完成:"
        ls -lh *.tar.gz

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: rootfsmesa-${{ env.MESA_VERSION }}-aarch64
        path: |
          ${{ env.PACKAGE_NAME }}-*.tar.gz
          checksums.txt

    - name: 创建轻量级发布
      uses: softprops/action-gh-release@v1
      if: ${{ github.event_name == 'workflow_dispatch' }}
      with:
        tag_name: rootfsmesa-${{ env.MESA_VERSION }}-aarch64-${{ env.BUILD_DATE }}
        name: Mesa rootfs ${{ env.MESA_VERSION }} (aarch64)
        body: |
          Mesa 3D Graphics Library for Android Container rootfs (Winlator 兼容)
          
          构建信息:
          - **版本**: ${{ env.MESA_VERSION }}
          - **架构**: aarch64
          - **Git 描述**: ${{ env.GIT_DESCRIBE }}
          - **提交哈希**: ${{ env.MESA_GIT_HASH }}
          - **构建日期**: ${{ env.BUILD_DATE }}
          - **分支**: ${{ env.MESA_BRANCH }}
          - **源码仓库**: lfdevs/mesa-for-android-container.git
          
          包含文件:
          - `${{ env.FULL_PACKAGE }}` - 完整 Mesa 安装包
          - `checksums.txt` - 校验和文件
          
          目录结构:
          ```
          usr/
          ├── bin/                 # 可执行文件
          ├── include/             # 头文件
          ├── lib/                 # aarch64 库目录
          │   └── dri/             # DRI 驱动
          └── share/               # 共享数据
          ```
          
          安装说明:
          1. 下载完整的 tar.gz 包
          2. 在 Android Container 环境中解压到根目录: `tar -xzf package.tar.gz -C /`
          
          使用说明:
          ```bash
          export LD_LIBRARY_PATH=/data/data/a.io.github.ewt45.winemulator/files/linbox/usr/lib:/data/data/a.io.github.ewt45.winemulator/files/linbox/usr/lib/dri:$LD_LIBRARY_PATH
          export LIBGL_DRIVERS_PATH=/data/data/a.io.github.ewt45.winemulator/files/linbox/usr/lib/dri
          ```
          
          驱动支持:
          - **aarch64**:
            - ✓ Gallium: freedreno, zink, llvmpipe
            - ✓ Vulkan: freedreno
            - ✓ OpenGL, OpenGL ES 1.x/2.x
            - ✓ EGL, GBM
            - ✓ X11 平台支持
            - ✓ 视频编解码器支持
          
          注意:
          - 专为 Android Container 环境 (如 Winlator) 优化
          - 需要 rootfs 环境
          - 已禁用 Wayland 支持
          - 基于 lfdevs/mesa-for-android-container 仓库构建，针对 Android 环境进行了优化
        files: |
          ${{ env.PACKAGE_NAME }}-*.tar.gz
          checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 输出总结
      run: |
        echo "✅ Mesa rootfs 构建完成!"
        echo "================================"
        echo "版本: $MESA_VERSION"
        echo "提交: $MESA_GIT_HASH"
        echo "构建日期: $BUILD_DATE"
        echo "分支: $MESA_BRANCH"
        echo "目标架构: aarch64"
        echo "环境: Android Container (Winlator 兼容)"
        echo ""
        echo "📦 生成的文件:"
        ls -1 *.tar.gz | while read file; do
          echo "  - $file"
        done
        echo ""
        
        echo "aarch64 架构支持:"
        echo "  ✓ Gallium: freedreno, zink, llvmpipe"
        echo "  ✓ Vulkan: freedreno"
        echo "  ✓ OpenGL, OpenGL ES 1.x/2.x"
        echo "  ✓ EGL, GBM"
        echo "  ✓ X11 平台支持"
        echo "  ✓ 视频编解码器支持"
        echo ""
        
        echo "安装目录结构:"
        echo "  /data/data/a.io.github.ewt45.winemulator/files/linbox/usr/lib/    - 库文件"
        echo "  /data/data/a.io.github.ewt45.winemulator/files/linbox/usr/lib/dri - DRI 驱动"
        echo "  /data/data/a.io.github.ewt45.winemulator/files/linbox/usr/bin/    - 可执行文件"