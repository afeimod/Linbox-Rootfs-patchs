# build-mesaglibc.yml
name: Build Mesa linbox(Multi-arch)

on:
  workflow_dispatch:
    inputs:
      mesa_branch:
        description: 'Mesa 分支/标签/提交 (例如: main, 24.3, 24.4.0, adreno-main)'
        required: false
        default: 'adreno-main'
        type: string
      use_upstream:
        description: '是否使用上游官方 Mesa (而不是 lfdevs 的分支)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      target_arch:
        description: '目标架构'
        required: false
        default: 'both'
        type: choice
        options:
          - 'aarch64'
          - 'arm-linux-gnueabihf'
          - 'both'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: 设置构建参数
      id: setup
      run: |
        # 设置默认参数
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "MESA_BRANCH=${{ github.event.inputs.mesa_branch || 'adreno-main' }}" >> $GITHUB_ENV
          echo "USE_UPSTREAM=${{ github.event.inputs.use_upstream || 'false' }}" >> $GITHUB_ENV
          echo "TARGET_ARCH=${{ github.event.inputs.target_arch || 'both' }}" >> $GITHUB_ENV
        else
          echo "MESA_BRANCH=adreno-main" >> $GITHUB_ENV
          echo "USE_UPSTREAM=false" >> $GITHUB_ENV
          echo "TARGET_ARCH=both" >> $GITHUB_ENV
        fi
        
        BUILD_DATE=$(date +%Y%m%d)
        echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
        
        # 设置安装临时目录（DESTDIR）
        echo "INSTALL_ROOT=$GITHUB_WORKSPACE/install-root" >> $GITHUB_ENV
        # Mesa 配置中的前缀仍为 /usr，实际安装到 INSTALL_ROOT/usr
        echo "MESA_PREFIX=/usr" >> $GITHUB_ENV
        
        echo "使用的 Mesa 分支/标签: $MESA_BRANCH"
        echo "是否使用上游: $USE_UPSTREAM"
        echo "目标架构: $TARGET_ARCH"
        echo "安装临时目录: $INSTALL_ROOT"
        echo "构建日期: $BUILD_DATE"

    - name: 创建安装临时目录
      run: |
        mkdir -p $INSTALL_ROOT
        echo "✅ 临时安装目录已创建: $INSTALL_ROOT"

    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 显示环境信息
      run: |
        echo "构建环境信息:"
        uname -a
        lscpu | grep -E 'Model name|Architecture|CPU MHz|Core'
        free -h
        echo "当前架构: $(uname -m)"
        echo "目标架构: $TARGET_ARCH"

    - name: 安装系统依赖
      run: |
        sudo sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
        
        # 先更新包列表
        sudo apt update
        
        # 安装基础依赖（用于 aarch64 构建）
        sudo apt install -y \
          glslang-tools libxrandr-dev libxxf86vm-dev libxcb-shm0-dev libxcb-glx0-dev \
          libxext-dev llvm-19 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev \
          libxcb-present-dev libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev \
          libxshmfence-dev libdrm-dev libgbm-dev libegl1-mesa-dev libexpat1-dev \
          python3-pip python3-setuptools python3-wheel ninja-build \
          pulseaudio libasound2-plugins wget unzip cmake git g++-arm-linux-gnueabihf \
          flex bison libtool libclc-20-dev pkg-config build-essential libatomic1 \
          gcc g++ make cmake
        
        # 如果包含 armhf 构建，安装交叉编译工具链
        if [ "$TARGET_ARCH" = "both" ] || [ "$TARGET_ARCH" = "arm-linux-gnueabihf" ]; then
          echo "安装 ARM 交叉编译工具链..."
          
          sudo apt install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            llvm-19-dev
        
          sudo dpkg --add-architecture armhf
          sudo apt update
          sudo apt upgrade -y
          sudo apt install -y \
            libxcb1-dev:armhf \
            libxcb-glx0-dev:armhf \
            libxcb-dri2-0-dev:armhf \
            libxcb-dri3-dev:armhf \
            libxcb-present-dev:armhf \
            libxcb-sync-dev:armhf \
            libxcb-shm0-dev:armhf \
            libxcb-xfixes0-dev:armhf \
            libxcb-randr0-dev:armhf \
            libxcb-xkb-dev:armhf \
            zenity:armhf libstdc++6:armhf \
            zlib1g-dev:armhf libexpat1-dev:armhf libdrm-dev:armhf libx11-dev:armhf \
            libxext-dev:armhf libxdamage-dev:armhf libxcb-glx0-dev:armhf libx11-xcb-dev:armhf \
            libxcb-dri2-0-dev:armhf libxcb-dri3-dev:armhf libxcb-present-dev:armhf \
            libxshmfence-dev:armhf libxxf86vm-dev:armhf libxrandr-dev:armhf libwayland-dev:armhf \
            wayland-protocols:armhf libwayland-egl-backend-dev:armhf libxcb-shm0-dev:armhf \
            pkg-config:armhf libgbm-dev:armhf libegl1-mesa-dev:armhf \
            libvulkan-dev:armhf \
            glslang-tools:armhf \
            vulkan-tools:armhf
       
          echo "ARM 交叉编译环境已准备"
        fi

    - name: 安装 Python 构建工具
      run: |
        sudo pip3 install meson mako
        
        echo "检查安装的 meson 版本:"
        meson --version
        python3 -c "import mesonbuild; print('mesonbuild 模块路径:', mesonbuild.__file__)"
        
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: 克隆 Mesa 源码
      run: |
        echo "📥 克隆 Mesa 仓库..."
        
        if [ "$USE_UPSTREAM" = "true" ]; then
          echo "使用上游官方 Mesa 仓库"
          git clone https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          
          if [ -n "$MESA_BRANCH" ] && [ "$MESA_BRANCH" != "adreno-main" ]; then
            echo "检出上游分支/标签/提交: $MESA_BRANCH"
            if git fetch origin "$MESA_BRANCH" 2>/dev/null; then
              git checkout "$MESA_BRANCH"
            else
              echo "未找到分支 '$MESA_BRANCH'，尝试作为标签检出..."
              if git fetch origin --tags 2>/dev/null && git checkout "tags/$MESA_BRANCH" 2>/dev/null; then
                echo "成功检出标签: $MESA_BRANCH"
              else
                echo "尝试作为提交哈希检出..."
                git checkout "$MESA_BRANCH" 2>/dev/null || {
                  echo "❌ 无法检出 '$MESA_BRANCH'，请检查分支/标签/提交是否存在"
                  exit 1
                }
              fi
            fi
          else
            echo "使用上游官方 Mesa 仓库的默认分支 (main)"
            git checkout main
          fi
        else
          echo "使用 lfdevs 的 Mesa for Android Container 仓库"
          git clone https://github.com/lfdevs/mesa-for-android-container.git mesa
          cd mesa
          
          if [ -n "$MESA_BRANCH" ] && [ "$MESA_BRANCH" != "main" ]; then
            echo "检出分支: $MESA_BRANCH"
            git checkout $MESA_BRANCH
          fi
        fi
        
        GIT_HASH=$(git rev-parse --short HEAD)
        if [ -f "VERSION" ]; then
          OFFICIAL_VERSION=$(cat VERSION)
        else
          OFFICIAL_VERSION="git-$GIT_HASH"
        fi
        
        GIT_DESCRIBE=$(git describe --tags --always 2>/dev/null || echo "custom-$GIT_HASH")
        
        echo "MESA_GIT_HASH=$GIT_HASH" >> $GITHUB_ENV
        echo "MESA_VERSION=$OFFICIAL_VERSION" >> $GITHUB_ENV
        echo "GIT_DESCRIBE=$GIT_DESCRIBE" >> $GITHUB_ENV
        echo "MESA_BRANCH_ACTUAL=$(git branch --show-current)" >> $GITHUB_ENV
        
        echo "✅ 源码克隆完成"
        echo "版本: $OFFICIAL_VERSION"
        echo "提交: $GIT_HASH"
        echo "描述: $GIT_DESCRIBE"
        echo "分支: $(git branch --show-current)"
        echo "标签/提交: $(git describe --tags 2>/dev/null || echo '无标签')"

    - name: 构建 aarch64 架构
      if: env.TARGET_ARCH == 'aarch64' || env.TARGET_ARCH == 'both'
      run: |
        echo "🔨 开始构建 aarch64 架构..."
        cd mesa
        
        mkdir -p build-aarch64
        
        meson setup build-aarch64 \
            --libdir=lib \
            -Dprefix=$MESA_PREFIX \
            -Dbuildtype=release \
            -Doptimization=3 \
            -Dplatforms=x11 \
            -Degl-native-platform=x11 \
            -Dglx=dri \
            -Dopengl=true \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dglvnd=disabled \
            -Degl=enabled \
            -Dllvm=enabled \
            -Dshared-llvm=enabled \
            -Dshader-cache=enabled \
            -Dxlib-lease=enabled \
            -Dvulkan-beta=true \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-extra-hud=true \
            -Dgallium-drivers=zink,freedreno,llvmpipe \
            -Dshader-cache-default=true \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dvideo-codecs=all \
            -Dmediafoundation-codecs=all \
            -Dgbm=enabled
        
        echo "🏗️  正在构建 aarch64..."
        ninja -C build-aarch64 -j$(nproc)
        
        echo "📦 安装 aarch64 到临时目录..."
        DESTDIR=$INSTALL_ROOT ninja -C build-aarch64 install
        
        echo "aarch64 安装验证:"
        ls -la $INSTALL_ROOT/$MESA_PREFIX/lib/

    - name: 构建 arm-linux-gnueabihf 架构
      if: env.TARGET_ARCH == 'arm-linux-gnueabihf' || env.TARGET_ARCH == 'both'
      run: |
        echo "🔨 开始构建 arm-linux-gnueabihf 架构..."
        cd mesa
        
        # 创建交叉编译配置文件
        wget -O cross-file.txt https://github.com/afeimod/linbox/raw/main/path/cross-file.txt
        
        echo "生成的 cross-file.txt 内容:"
        cat cross-file.txt
        
        mkdir -p build-armhf
        
        export CC="arm-linux-gnueabihf-gcc"
        export CXX="arm-linux-gnueabihf-g++"
        export AR="arm-linux-gnueabihf-ar"
        export STRIP="arm-linux-gnueabihf-strip"
        export PKG_CONFIG_PATH="/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/arm-linux-gnueabihf/lib/pkgconfig:/usr/share/pkgconfig"
        export PKG_CONFIG_LIBDIR="/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/arm-linux-gnueabihf/lib/pkgconfig:/usr/share/pkgconfig"
        export CFLAGS="-march=armv8-a -mfpu=neon-vfpv4 -mfloat-abi=hard -marm"
        export CXXFLAGS="-march=armv8-a -mfpu=neon-vfpv4 -mfloat-abi=hard -marm"
        export LDFLAGS="-march=armv8-a -mfpu=neon-vfpv4 -mfloat-abi=hard -marm"
        
        echo "检查交叉编译工具:"
        which arm-linux-gnueabihf-gcc
        arm-linux-gnueabihf-gcc --version
        
        echo "检查目标架构库路径:"
        ls -la /usr/lib/arm-linux-gnueabihf/libz.* 2>/dev/null || echo "未找到 armhf 的 libz"
        echo "主机架构库路径:"
        ls -la /usr/lib/aarch64-linux-gnu/libz.* 2>/dev/null || echo "未找到 aarch64 的 libz"
        
        echo "正在配置 Mesa 构建 (armhf)..."
        
        CONFIG_SUCCESS=false
        
        # 尝试简化配置（禁用 llvm 等）
        echo "尝试配置..."
        meson setup build-armhf \
            --cross-file cross-file.txt \
            --libdir=lib32 \
            -Dprefix=$MESA_PREFIX \
            -Dbuildtype=release \
            -Doptimization=3 \
            -Dplatforms=x11 \
            -Degl-native-platform=x11 \
            -Dglx=dri \
            -Dopengl=true \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dglvnd=disabled \
            -Degl=enabled \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dshader-cache=enabled \
            -Dxlib-lease=enabled \
            -Dvulkan-beta=true \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-extra-hud=true \
            -Dgallium-drivers=zink,freedreno \
            -Dshader-cache-default=true \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dvideo-codecs=all \
            -Dmediafoundation-codecs=all \
            -Dgbm=enabled
        
        if [ $? -eq 0 ]; then
          echo "✅ 配置成功"
          CONFIG_SUCCESS=true
        else
          echo "❌ 配置失败，尝试进一步简化..."
          rm -rf build-armhf
          mkdir -p build-armhf
          
          # 进一步简化（禁用更多功能）
          meson setup build-armhf \
              --cross-file cross-file.txt \
              --libdir=lib32 \
              -Dprefix=$MESA_PREFIX \
              -Dbuildtype=release \
              -Doptimization=3 \
              -Dplatforms=x11 \
              -Degl-native-platform=x11 \
              -Dglx=dri \
              -Dopengl=true \
              -Dgles1=enabled \
              -Dgles2=enabled \
              -Dglvnd=disabled \
              -Degl=enabled \
              -Dllvm=disabled \
              -Dshared-llvm=disabled \
              -Dshader-cache=enabled \
              -Dxlib-lease=enabled \
              -Dvulkan-beta=true \
              -Dlibunwind=disabled \
              -Dvalgrind=disabled \
              -Dmicrosoft-clc=disabled \
              -Dgallium-extra-hud=true \
              -Dgallium-drivers=zink,freedreno \
              -Dshader-cache-default=true \
              -Dvulkan-drivers=freedreno \
              -Dfreedreno-kmds=msm,kgsl \
              -Dvideo-codecs=all \
              -Dmediafoundation-codecs=all \
              -Dgbm=enabled
        
          if [ $? -eq 0 ]; then
            echo "✅ 简化配置成功"
            CONFIG_SUCCESS=true
          else
            echo "❌ 所有配置尝试都失败了"
            exit 1
          fi
        fi
        
        if [ "$CONFIG_SUCCESS" = "true" ]; then
          echo "🏗️  正在构建 armhf..."
          if ninja -C build-armhf -j$(nproc); then
            echo "✅ 并行构建成功"
          else
            echo "⚠️ 并行构建失败，尝试单线程构建..."
            if ninja -C build-armhf -j1; then
              echo "✅ 单线程构建成功"
            else
              echo "❌ 构建失败"
              exit 1
            fi
          fi
          
          echo "📦 安装 armhf 到临时目录..."
          DESTDIR=$INSTALL_ROOT ninja -C build-armhf install
          
          echo "armhf 安装验证:"
          ls -la $INSTALL_ROOT/$MESA_PREFIX/lib32/
        fi

    - name: 打包构建产物
      run: |
        echo "📦 开始打包..."
        
        if [ "$TARGET_ARCH" = "both" ]; then
          PACKAGE_NAME="glibcmesa-${MESA_VERSION}-multiarch"
          ARCH_DESC="multiarch (aarch64 + armhf)"
        elif [ "$TARGET_ARCH" = "aarch64" ]; then
          PACKAGE_NAME="glibcmesa-${MESA_VERSION}-aarch64"
          ARCH_DESC="aarch64"
        elif [ "$TARGET_ARCH" = "arm-linux-gnueabihf" ]; then
          PACKAGE_NAME="glibcmesa-${MESA_VERSION}-armhf"
          ARCH_DESC="arm-linux-gnueabihf"
        fi
        
        # 进入安装临时目录，打包所有内容（不包含 install-root 本身）
        cd $INSTALL_ROOT
        tar -czvf "${GITHUB_WORKSPACE}/${PACKAGE_NAME}-full.tar.gz" .
        
        cd $GITHUB_WORKSPACE
        sha256sum ${PACKAGE_NAME}-*.tar.gz > checksums.txt
        
        echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
        echo "FULL_PACKAGE=${PACKAGE_NAME}-full.tar.gz" >> $GITHUB_ENV
        echo "ARCH_DESC=${ARCH_DESC}" >> $GITHUB_ENV
        
        echo "📦 打包完成:"
        ls -lh *.tar.gz

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: glibcmesa-${{ env.MESA_VERSION }}-${{ env.TARGET_ARCH }}
        path: |
          ${{ env.PACKAGE_NAME }}-*.tar.gz
          checksums.txt

    - name: 创建轻量级发布
      uses: softprops/action-gh-release@v1
      if: ${{ github.event_name == 'workflow_dispatch' }}
      with:
        tag_name: glibcmesa-${{ env.MESA_VERSION }}-${{ env.TARGET_ARCH }}-${{ env.BUILD_DATE }}
        name: Mesa glibc ${{ env.MESA_VERSION }} (${{ env.ARCH_DESC }})
        body: |
          Mesa 3D Graphics Library for Termux glibc (glibc)
          
          构建信息:
          - **版本**: ${{ env.MESA_VERSION }}
          - **架构**: ${{ env.ARCH_DESC }}
          - **Git 描述**: ${{ env.GIT_DESCRIBE }}
          - **提交哈希**: ${{ env.MESA_GIT_HASH }}
          - **构建日期**: ${{ env.BUILD_DATE }}
          - **分支**: ${{ env.MESA_BRANCH }}
          - **仓库**: $(if [ "${{ env.USE_UPSTREAM }}" = "true" ]; then echo "上游官方"; else echo "lfdevs/android-container"; fi)
          
          包含文件:
          - `${{ env.FULL_PACKAGE }}` - 完整 Mesa 安装包
          - `checksums.txt` - 校验和文件
          
          $(if [ "${{ env.TARGET_ARCH }}" = "both" ]; then
            echo "多架构包目录结构:"
            echo "```"
            echo "mesa/"
            echo "├── bin/                 # 可执行文件"
            echo "├── include/             # 头文件"
            echo "├── lib/                 # 64位库 (aarch64)"
            echo "│   └── dri/             # 64位 DRI 驱动"
            echo "├── lib32/               # 32位库 (armhf)"
            echo "│   └── dri/             # 32位 DRI 驱动"
            echo "└── share/               # 共享数据"
            echo "```"
          fi)
          
          安装说明:
          1. 下载完整的 tar.gz 包
          2. 在 glibc 环境中解压到根目录: `tar -xzf package.tar.gz -C /`
          
          $(if [ "${{ env.TARGET_ARCH }}" = "both" ]; then
            echo "多架构使用说明:"
            echo "- 默认情况下，系统会自动选择合适的架构"
            echo "- 可以手动设置环境变量来选择特定架构:"
            echo "  ```bash"
            echo "  # 使用 64 位库"
            echo "  export LD_LIBRARY_PATH=/usr/lib:/usr/lib/dri:\$LD_LIBRARY_PATH"
            echo "  export LIBGL_DRIVERS_PATH=/usr/lib/dri"
            echo "  # 或者使用 32 位库"
            echo "  export LD_LIBRARY_PATH=/usr/lib32:/usr/lib32/dri:\$LD_LIBRARY_PATH"
            echo "  export LIBGL_DRIVERS_PATH=/usr/lib32/dri"
            echo "  ```"
          else
            echo "使用说明:"
            echo "  ```bash"
            echo "  export LD_LIBRARY_PATH=/usr/lib:/usr/lib/dri:\$LD_LIBRARY_PATH"
            echo "  export LIBGL_DRIVERS_PATH=/usr/lib/dri"
            echo "  ```"
          fi)
          
          驱动支持:
          $(if [ "${{ env.TARGET_ARCH }}" = "aarch64" ] || [ "${{ env.TARGET_ARCH }}" = "both" ]; then
            echo "- **aarch64**:"
            echo "  - ✓ Gallium: freedreno, zink, llvmpipe"
            echo "  - ✓ Vulkan: freedreno"
            echo "  - ✓ OpenGL, OpenGL ES 1.x/2.x"
            echo "  - ✓ EGL, GBM"
          fi)
          
          $(if [ "${{ env.TARGET_ARCH }}" = "arm-linux-gnueabihf" ] || [ "${{ env.TARGET_ARCH }}" = "both" ]; then
            echo "- **armhf**:"
            echo "  - ✓ Gallium: zink, freedreno (软件渲染)"
            echo "  - ✓ OpenGL, OpenGL ES 1.x/2.x"
            echo "  - ✓ EGL"
            echo "  - ✗ Vulkan (已禁用)"
          fi)
          
          注意:
          - 需要 glibc 环境 (如 Ubuntu/Debian)
          - 推荐在容器或 chroot 中使用
          - armhf 版本可能仅支持软件渲染
        files: |
          ${{ env.PACKAGE_NAME }}-*.tar.gz
          checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 输出总结
      run: |
        echo "✅ Mesa glibc 构建完成!"
        echo "================================"
        echo "版本: $MESA_VERSION"
        echo "提交: $MESA_GIT_HASH"
        echo "构建日期: $BUILD_DATE"
        echo "分支: $MESA_BRANCH"
        echo "目标架构: $ARCH_DESC"
        echo "环境: Termux (glibc)"
        echo ""
        echo "📦 生成的文件:"
        ls -1 *.tar.gz | while read file; do
          echo "  - $file"
        done
        echo ""
        
        if [ "$TARGET_ARCH" = "aarch64" ] || [ "$TARGET_ARCH" = "both" ]; then
          echo "aarch64 架构支持:"
          echo "  ✓ Gallium: freedreno, zink, llvmpipe"
          echo "  ✓ Vulkan: freedreno"
          echo "  ✓ OpenGL, OpenGL ES 1.x/2.x"
          echo "  ✓ EGL, GBM"
          echo ""
        fi
        
        if [ "$TARGET_ARCH" = "arm-linux-gnueabihf" ] || [ "$TARGET_ARCH" = "both" ]; then
          echo "armhf 架构支持:"
          echo "  ✓ Gallium: zink, freedreno"
          echo "  ✓ OpenGL, OpenGL ES 1.x/2.x"
          echo "  ✓ EGL"
          echo "  ✗ Vulkan (已禁用)"
          echo ""
        fi
        
        if [ "$TARGET_ARCH" = "both" ]; then
          echo "多架构目录结构:"
          echo "  /usr/lib/    - 64位 (aarch64) 库"
          echo "  /usr/lib32/  - 32位 (armhf) 库"
        fi